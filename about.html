<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="EAF" />
  <link rel="manifest" href="/site.webmanifest" />
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="nav-logo" aria-label="Retour a l'accueil">
        <img
          src="https://raw.githubusercontent.com/ernieandflo-dotcom/bookshelf/0894cab24a3cba51023ef85c8541652ef5d89e5c/images/meme_sealofapproval.svg"
          alt="Ernie And Flo"
          width="44" height="44"
        >
      </a>

      <button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="dropdown-menu"
        data-i18n-aria="nav.toggle">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      </button>

      <ul class="nav-links" role="navigation" data-i18n-aria="nav.label">
        <li><div class="nav-divider" aria-hidden="true"></div></li>
        <li><a href="index.html" data-i18n="nav.home">Accueil</a></li>
        <li><div class="nav-divider" aria-hidden="true"></div></li>
        <li><a href="books.html" data-i18n="nav.books">Livres</a></li>
        <li><div class="nav-divider" aria-hidden="true"></div></li>
        <li><a href="about.html" data-i18n="nav.about">A propos</a></li>
        <li><div class="nav-divider" aria-hidden="true"></div></li>
      </ul>

      <div id="dropdown-menu" class="dropdown-menu" role="navigation" data-i18n-aria="nav.mobile">
        <a href="index.html" data-i18n="nav.home">Accueil</a>
        <a href="books.html" data-i18n="nav.books">Livres</a>
        <a href="about.html" data-i18n="nav.about">A propos</a>
      </div>
    </nav>
  </header>


  <section class="section" aria-labelledby="about-heading">
    <h1 class="section__title" id="about-heading" data-i18n="about.heading">A propos</h1>

    <p class="section__lead" data-i18n="about.lead__html"></p>

    <form
      id="contactForm"
      action="https://api.staticforms.xyz/submit"
      method="post"
      class="form-card"
    >
      <input type="hidden" name="accessKey" value="578131e7-ecc8-460f-887c-7cc2649144f7">
      <input type="hidden" name="redirectTo" value="https://www.ernieandflo.com/message-sent.html">
      <input type="text" name="honeypot" class="honeypot" tabindex="-1" autocomplete="off">

      <div class="form-group">
        <label for="name" data-i18n="about.form.name">Nom</label>
        <input type="text" id="name" name="name" required
          data-i18n-placeholder="about.form.name.ph"
          placeholder="Votre nom">
      </div>

      <div class="form-group">
        <label for="email" data-i18n="about.form.email">Adresse courriel</label>
        <input type="email" id="email" name="email" required
          data-i18n-placeholder="about.form.email.ph"
          placeholder="votre@courriel.com"
          pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$">
      </div>

      <div class="form-group">
        <label for="message" data-i18n="about.form.message">Message</label>
        <textarea id="message" name="message" rows="4" required
          data-i18n-placeholder="about.form.message.ph"
          placeholder="Votre message..."></textarea>
      </div>

      <div class="form-group consent-row">
        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent" data-i18n="about.form.consent">
          Je consens a l'utilisation de mes informations personnelles a des fins de communication.
        </label>
      </div>

      <div class="form-group">
        <div class="g-recaptcha" data-sitekey="6Lev4o8qAAAAAOGUf1vY-RBsiPlVgZTL-LKwICuh"></div>
        <p id="recaptchaError" class="form-error" data-i18n="about.form.recaptcha">
          Veuillez completer la verification reCAPTCHA.
        </p>
      </div>

      <button type="submit" class="btn btn--red btn--full" data-i18n="about.form.submit">Envoyer</button>
    </form>
  </section>


  <footer>
    <div class="footer-inner">
      <p data-i18n="footer.copy">&copy; 2026 Ernie And Flo Creations. Tous droits reserves.</p>
      <p><a href="about.html" data-i18n="footer.contact">Contact</a></p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/i18n-engine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
